name: CI

# Every PR, plus main itself. Main is covered separately from the PR that
# merged into it because a merge commit is code that no run has ever seen:
# two PRs, each green on its own, can still break main together.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to the same PR makes the previous run's answer irrelevant, so
  # cancel it. Pushes to main are never cancelled — every commit on main keeps
  # its own status, which is what makes "main was green at commit X" checkable.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Separate from `ci` on purpose: this needs no database and no dependency
  # install, so a docs-only pull request learns its markers are stale in
  # seconds instead of waiting on Postgres and the test suite.
  markers:
    name: Conformance markers
    runs-on: ubuntu-latest

    # A fork does not inherit the upstream issue list, so every marker would
    # resolve to "does not exist" and the job would fail wholesale on a fork's
    # own pushes. Pull requests aimed back here are unaffected — those run in
    # this repository's context, where the issues live.
    if: ${{ !github.event.repository.fork }}

    permissions:
      # Checkout only; this job never writes to the repository.
      contents: read
      # The only job that reads issue state. Job-level so the test job below
      # keeps the narrower workflow default.
      issues: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # No `npm ci`: the script imports nothing outside node: builtins, which
      # is what keeps this job to a few seconds.
      - run: npm run check:markers
        env:
          GITHUB_TOKEN: ${{ github.token }}

  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Same major version as docker-compose.yml — CI testing against a
        # different Postgres than local development is how a green pipeline
        # starts lying. Deliberately a tag and not a @sha256 digest: the tag is
        # what holds this in step with compose, while a digest would pin CI to
        # one architecture-specific build and let the two drift apart quietly.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: personal_api
          POSTGRES_PASSWORD: personal_api_password
          POSTGRES_DB: personal_api
        ports:
          - 5432:5432
        # Without this the steps below start the moment the container exists,
        # which is earlier than the moment Postgres accepts connections.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # personal_api_test does not exist yet: src/test/global-setup.ts creates
      # it, applies the migrations and truncates it, exactly as it does locally.
      # That is the point — no CI-specific branch in the test bootstrap.
      #
      # DATABASE_URL is deliberately NOT set here. src/test/env-setup.ts derives
      # it from TEST_DATABASE_URL, and global-setup.ts refuses to run when the
      # two point at the same database (a guard against wiping the dev database
      # by copy-paste). Setting it here would trip that guard on every run.
      TEST_DATABASE_URL: postgresql://personal_api:personal_api_password@localhost:5432/personal_api_test
      # Read by src/lib/auth.ts's Zod schema at import time; the tests never
      # dereference the URL, they only need it to be a valid one.
      BETTER_AUTH_URL: http://localhost:3000
      # A literal, deliberately, and not ${{ secrets.* }}. This value protects
      # nothing: the tests sign nothing real, and src/lib/auth.ts only needs it
      # to clear a Zod length check at import time. Were it read from secrets,
      # it would arrive empty in every run GitHub keeps secrets out of — pull
      # requests from forks, and pull requests opened by Dependabot — and the
      # run would fail on "must be at least 32 characters", an error about the
      # value that never mentions the missing delivery. Dependabot is the case
      # that bites: it runs against a separate secret store, and it is the only
      # thing keeping the SHA pins below from going stale, so those pull
      # requests could never be reviewed green.
      # Written to be unusable on sight, so it can never become the string
      # somebody copies into an environment where a secret does matter.
      BETTER_AUTH_SECRET: ci-only-not-a-real-secret-0000000000000000

    steps:
      # Pinned to a commit SHA rather than a tag: a tag can be moved, and a
      # moved tag is someone else's code running with this job's token — how
      # tj-actions/changed-files was turned against its users in 2025. The
      # trailing comment carries the human-readable version; keep the two in
      # step when bumping.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout leaves GITHUB_TOKEN in .git/config by default, and every
          # step after this one executes code from the PR branch (npm lifecycle
          # scripts, test files). Nothing here pushes, so there is no reason to
          # leave a token where that code can read it.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Quoted so YAML keeps it a version string: a future '24.10' read as
          # a number would silently become 24.1.
          node-version: '24'
          cache: npm

      # ci, not install: fails on a package.json/package-lock.json mismatch
      # instead of quietly resolving new versions the lockfile never pinned.
      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test
